<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Основа — практичная HR-платформа: сотрудники, онбординг, отпуска и структура команды."
    />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <title>Основа — HR-платформа</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5' fill='white'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5' fill='white' opacity='.45'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5' fill='white' opacity='.45'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('osnova_theme_preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'contrast'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          var accent = localStorage.getItem('osnova_accent_color') || '#1d4ed8';
          if (!/^#[0-9a-fA-F]{6}$/.test(accent)) accent = '#1d4ed8';
          var r = parseInt(accent.slice(1, 3), 16);
          var g = parseInt(accent.slice(3, 5), 16);
          var b = parseInt(accent.slice(5, 7), 16);
          var channels = [r, g, b].map(function (channel) {
            var value = channel / 255;
            return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
          });
          var luminance = 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
          var delta = theme === 'dark' ? 24 : -24;
          var hover =
            '#' +
            [r, g, b]
              .map(function (channel) {
                return Math.max(0, Math.min(255, Math.round(channel + delta)))
                  .toString(16)
                  .padStart(2, '0');
              })
              .join('');
          var textDelta = theme === 'light' ? 0 : theme === 'contrast' ? 150 : 110;
          var accentText =
            '#' +
            [r, g, b]
              .map(function (channel) {
                return Math.max(0, Math.min(255, Math.round(channel + textDelta)))
                  .toString(16)
                  .padStart(2, '0');
              })
              .join('');
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
          root.style.setProperty('--accent', accent);
          root.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
          root.style.setProperty('--accent-hover', hover);
          root.style.setProperty('--accent-contrast', luminance > 0.52 ? '#111827' : '#ffffff');
          root.style.setProperty('--accent-soft', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.12)');
          root.style.setProperty(
            '--accent-border',
            'rgba(' + r + ', ' + g + ', ' + b + ', 0.38)',
          );
          root.style.setProperty('--accent-text', accentText);
        } catch (error) {
          /* The default light theme in CSS remains usable. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
